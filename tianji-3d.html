function tick(t){requestAnimationFrame(tick);resize();
if(motion){const k=Math.min(1,(t-motion.begin)/motion.duration),v=ease(k);camera.position.lerpVectors(motion.from,motion.target,v);targetLook.lerpVectors(motion.fromLook,motion.toLook,v);if(k>=1){const done=motion.done;motion=null;moving=false;if(done)done();if(!selected)camTo.copy(camera.position)}}
camera.lookAt(targetLook);
floating.forEach((m,i)=>{m.position.y+=Math.sin(t*.00065+i)*.00035});
for(const {item,button} of spots){tmp.set(...item.pos).project(camera);const visible=opened&&!selected&&!motion&&tmp.z>0&&tmp.z<1&&Math.abs(tmp.x)<.89&&Math.abs(tmp.y)<.8;button.style.opacity=visible?'1':'0';button.style.pointerEvents=visible?'auto':'none';button.style.left=((tmp.x+1)*50)+'%';button.style.top=((-tmp.y+1)*50)+'%'}
renderer.render(scene,camera)}
requestAnimationFrame(tick);$('loading').classList.add('hidden');
